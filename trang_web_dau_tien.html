<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web đầu tiên của tôi</title>
</head>
<body>
    <!-- Tiêu đề chính của trang -->
    <h1>Xin chào! Đây là trang web đầu tiên của tôi.</h1>

    <!-- Một đoạn văn bản -->
    <p>Tôi đang học lập trình HTML.</p>

    <!-- Một liên kết -->
    <a href="https://www.google.com" target="_blank">
        Mở Google
    </a>

    <!-- Một hình ảnh mẫu: thay URL bằng đường dẫn ảnh của bạn -->
    <!-- <img src="hinh-anh.jpg" alt="Mô tả hình ảnh" width="300"> -->

    <!-- Một danh sách -->
    <h2>Những điều tôi muốn học</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
    </ul>

    <!-- Một nút bấm đơn giản -->
    <button onclick="alert('Xin chào!')">Bấm vào đây</button>
</body>
</html>
